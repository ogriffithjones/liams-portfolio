# Production deploys go through a Vercel deploy hook instead of Vercel's
# Git integration. The Ampersand team is on Vercel Pro, which blocks Git
# deployments of commits written by anyone who isn't a member of the Vercel
# team, and saves from the CMS are written by whoever is signed in (Liam).
# A deploy hook builds the latest main regardless of who wrote the commit.
# Git deploys for main are switched off in vercel.json to avoid doubles.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
